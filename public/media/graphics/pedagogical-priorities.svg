<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pedagogical priorities - Tiffany Tindall</title>
  <desc id="desc">Thought-leadership graphic by Tiffany Tindall, Arts Education Leader: Personal and relational; Employability through the arts; Arts access for every student.</desc>
  <rect width="1200" height="630" fill="#1E2A5A"/>
  <path d="M40 560 C 320 600, 780 480, 1160 120" fill="none" stroke="#FAF6EE" stroke-width="2" stroke-opacity="0.08" stroke-linecap="round"/>
  <text x="56" y="80" fill="#FAF6EE" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="2.8" opacity="0.85">PEDAGOGICAL PRIORITIES</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="600" fill="#FAF6EE">
    <circle cx="88" cy="172" r="28" fill="none" stroke="#FAF6EE" stroke-width="2.5" stroke-opacity="0.55"/>
    <text x="88" y="183" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FAF6EE">1</text>
    <text x="140" y="190" font-size="60">Personal and relational</text>

    <circle cx="88" cy="278" r="28" fill="none" stroke="#FAF6EE" stroke-width="2.5" stroke-opacity="0.55"/>
    <text x="88" y="289" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FAF6EE">2</text>
    <text x="140" y="296" font-size="60">Employability through the arts</text>

    <circle cx="88" cy="384" r="28" fill="none" stroke="#FAF6EE" stroke-width="2.5" stroke-opacity="0.55"/>
    <text x="88" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FAF6EE">3</text>
    <text x="140" y="402" font-size="60">Arts access for every student</text>
  </g>
  <text x="40" y="542" fill="#FAF6EE" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="600">Tiffany Tindall</text>
  <path d="M40 560 C 150 568, 270 548, 370 514" fill="none" stroke="#E8A917" stroke-width="2.75" stroke-linecap="round"/>
