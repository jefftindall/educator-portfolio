<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Lessons learned as an educator - Tiffany Tindall</title>
  <desc id="desc">Thought-leadership graphic by Tiffany Tindall, Arts Education Leader: Do not change the standard; change the instructional method.</desc>
  <rect width="1200" height="630" fill="#FAF6EE"/>
  <path d="M40 560 C 320 600, 780 480, 1160 120" fill="none" stroke="#E7E2D8" stroke-width="3" stroke-linecap="round"/>
  <text x="56" y="96" fill="#1B7F79" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="2.8">LESSONS LEARNED AS AN EDUCATOR</text>
  <text x="56" y="268" fill="#1E2A5A" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="600" font-style="italic">"Don't change the standard;</text>
  <text x="56" y="354" fill="#1E2A5A" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="600" font-style="italic">change the instructional method."</text>
  <text x="40" y="542" fill="#1E2A5A" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="600">Tiffany Tindall</text>
  <path d="M40 560 C 150 568, 270 548, 370 514" fill="none" stroke="#E8A917" stroke-width="2.75" stroke-linecap="round"/>
  <text x="40" y="594" fill="#1B7F79" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="1.8">ARTS EDUCATION LEADER</text>
</svg>
